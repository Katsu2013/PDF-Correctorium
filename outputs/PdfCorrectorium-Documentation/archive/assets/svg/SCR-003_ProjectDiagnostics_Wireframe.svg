<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">SCR-007 プロジェクト診断・修復 — 将来の設計案</title><desc id="desc">未実装 / この図は現行画面ではありません。旧図のSCR-003というファイル名は参照互換のため維持しています。</desc>
<style>text{font-family:'Yu Gothic UI','Meiryo','Segoe UI',sans-serif;fill:#263746}.t{font-size:15px}.muted{font-size:14px;fill:#667085}.title{font-size:23px;font-weight:600}.small{font-size:13px}.accent{font-size:15px;fill:#d72c30}.label{font-size:17px;font-weight:600}</style>
<rect width="1280" height="850" fill="#f5f6f8"/><text x="25" y="34" class="title">SCR-007 プロジェクト診断・修復 — 将来の設計案</text><text x="25" y="61" class="muted">未実装 / この図は現行画面ではありません。旧図のSCR-003というファイル名は参照互換のため維持しています。</text><rect x="140" y="112" width="1000" height="636" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="175" y="159" class="title">目標: 検査結果から保全コピー・修復・救出へ進む</text><rect x="170" y="187" width="940" height="57" rx="3" fill="#fff5df" stroke="#b8c1ce"/><text x="192" y="221" class="t">現行で使える範囲: ZIP・参照検証と、自動保存/バックアップからの明示復元</text><text x="183" y="295" class="label">検査項目（設計案）</text><text x="184" y="337" class="t">ZIPコンテナー / manifest / 元PDF参照 / ページJSON</text><text x="184" y="377" class="t">コメント・監査履歴・UI作業状態の検査は将来機能</text><rect x="173" y="415" width="934" height="142" rx="3" fill="#fff5df" stroke="#b8c1ce"/><text x="192" y="450" class="label">修復候補の説明（将来）</text><text x="192" y="488" class="t">元プロジェクトを直接変更せず、保全コピーと修復済み新規ファイルを作成する。</text><text x="192" y="525" class="t">破損の種類に応じて自動修復・確認後修復・読み取り専用・データ救出を選ぶ。</text><rect x="185" y="613" width="190" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="195" y="633" class="t">修復を実行（未実装）</text><rect x="396" y="613" width="190" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="406" y="633" class="t">詳細を表示（設計案）</text><rect x="607" y="613" width="232" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="617" y="633" class="t">診断結果を保存（設計案）</text><text x="25" y="817" class="muted">未実装機能の受入完了を示す図ではありません。実装範囲は画面設計とIMPLEMENTATION_STATUSを参照。</text></svg>
