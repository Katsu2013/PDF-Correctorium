<rect width="1280" height="850" fill="#f5f6f8"/><text x="25" y="34" class="title">SCR-002 OCR編集</text><text x="25" y="61" class="muted">現行UIの模式図 / 校正モードでは通常の配置・文字幅操作を無効にします。</text><rect x="20" y="85" width="1240" height="700" rx="3" fill="#fff" stroke="#b8c1ce"/><rect x="35" y="101" width="778" height="662" fill="#343e49"/><rect x="142" y="118" width="560" height="622" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="182" y="178" class="label">画像上の文字とOCRの位置を確認</text><g transform="rotate(-7 424 338)"><rect x="196" y="305" width="470" height="54" fill="#ffdd6544" stroke="#d72c30"/><path d="M431 305V287" stroke="#d72c30"/><rect x="427" y="278" width="8" height="9" fill="#ffdf00" stroke="#9a6b00"/><rect x="192" y="301" width="8" height="8" fill="#fff" stroke="#d72c30"/><rect x="662" y="355" width="8" height="8" fill="#fff" stroke="#d72c30"/><text x="215" y="340" class="title">第17章　斜めの見出し</text></g><text x="844" y="124" class="label">OCRプロパティ</text><text x="844" y="161" class="t">確認ステータス</text><rect x="844" y="172" width="387" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="853" y="192" class="t">修正済み</text><text x="1210" y="192" class="muted">⌄</text><text x="844" y="225" class="t">文字方向</text><rect x="844" y="236" width="387" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="853" y="256" class="t">横書き</text><text x="1210" y="256" class="muted">⌄</text><text x="844" y="290" class="t">行の文字列</text><rect x="844" y="302" width="387" height="53" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="855" y="333" class="t">第17章　斜めの見出し</text><text x="844" y="390" class="t">変更前</text><rect x="844" y="401" width="387" height="34" rx="3" fill="#f4f5f7" stroke="#b8c1ce"/><text x="855" y="424" class="t">第11章　斜めの見出し</text><text x="844" y="471" class="t">行内の全文字サイズ</text><text x="850" y="506" class="t">−　＋　等幅化　取込時へ復元</text><text x="844" y="549" class="t">単語ごとの読み方</text><rect x="844" y="559" width="387" height="43" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="844" y="636" class="