<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">dev.153 OCR編集と墨消しの排他モード切替</title>
  <desc id="desc">ツールバーと編集モード一覧が同期し、OCR編集と墨消しで右ペインとページ操作が排他的に切り替わる現行UIの模式図。</desc>
  <style>
    text{font-family:'Yu Gothic UI','Meiryo','Segoe UI',sans-serif;fill:#263746}.title{font-size:24px;font-weight:600}.h{font-size:18px;font-weight:600}.t{font-size:15px}.s{font-size:13px}.muted{fill:#667085}.panel{fill:#fff;stroke:#b8c1ce}.button{fill:#fff;stroke:#9aa6b2}.active{fill:#d72c30;stroke:#b71c1c}.soft{fill:#fff4f4;stroke:#d72c30}.ok{fill:#e9f7ef;stroke:#2e8b57}
  </style>
  <rect width="1280" height="760" fill="#f5f6f8"/>
  <text x="28" y="40" class="title">OCR編集／墨消しの排他モード切替（dev.153）</text>
  <text x="28" y="68" class="t muted">表示、ポインター、コマンド可否、右プロパティを1つの編集モード値から同時に切り替えます。</text>

  <rect x="28" y="92" width="590" height="492" rx="4" class="panel"/>
  <text x="48" y="126" class="h">OCR編集モード</text>
  <rect x="48" y="148" width="550" height="48" fill="#fff" stroke="#d8dee6"/>
  <rect x="62" y="158" width="116" height="28" rx="3" class="active"/>
  <text x="80" y="178" class="t" style="fill:#fff">T　OCR編集</text>
  <rect x="186" y="158" width="100" height="28" rx="3" class="button"/>
  <rect x="199" y="166" width="19" height="12" fill="#263746"/><text x="226" y="178" class="t">墨消し</text>
  <rect x="418" y="158" width="164" height="28" rx="3" class="active"/>
  <text x="458" y="178" class="t" style="fill:#fff">OCR編集 ▼</text>
  <rect x="48" y="214" width="356" height="342" fill="#343e49"/>
  <rect x="78" y="238" width="296" height="292" fill="#fff" stroke="#b8c1ce"/>
  <rect x="112" y="286" width="218" height="64" fill="#fff4cf" stroke="#e65100" stroke-width="2"/>
  <text x="126" y="313" class="h">OCR文字領域</text><text x="126" y="338" class="s muted">選択・移動・サイズ・回転</text>
  <circle cx="112" cy="286" r="5" fill="#fff" stroke="#e65100"/><circle cx="330" cy="350" r="5" fill="#fff" stroke="#e65100"/>
  <rect x="420" y="214" width="178" height="342" fill="#fff" stroke="#d8dee6"/>
  <text x="436" y="246" class="h">OCRプロパティ</text>
  <text x="436" y="282" class="t">文字列</text><rect x="436" y="292" width="146" height="32" class="button"/>
  <text x="436" y="356" class="t">位置・サイズ</text><rect x="436" y="366" width="66" height="30" class="button"/><rect x="516" y="366" width="66" height="30" class="button"/>
  <rect x="436" y="430" width="146" height="42" rx="3" class="ok"/><text x="450" y="456" class="t">OCR操作を有効</text>

  <rect x="662" y="92" width="590" height="492" rx="4" class="panel"/>
  <text x="682" y="126" class="h">墨消しモード</text>
  <rect x="682" y="148" width="550" height="48" fill="#fff" stroke="#d8dee6"/>
  <rect x="696" y="158" width="116" height="28" rx="3" class="button"/>
  <text x="714" y="178" class="t">T　OCR編集</text>
  <rect x="820" y="158" width="100" height="28" rx="3" class="active"/>
  <rect x="833" y="166" width="19" height="12" fill="#fff"/><text x="860" y="178" class="t" style="fill:#fff">墨消し</text>
  <rect x="1052" y="158" width="164" height="28" rx="3" class="active"/>
  <text x="1092" y="178" class="t" style="fill:#fff">墨消し ▼</text>
  <rect x="682" y="214" width="356" height="342" fill="#343e49"/>
  <rect x="712" y="238" width="296" height="292" fill="#fff" stroke="#b8c1ce"/>
  <text x="744" y="280" class="t muted">ページ上を十字ポインターでドラッグ</text>
  <rect x="754" y="306" width="210" height="70" fill="#102030" fill-opacity=".72" stroke="#d72c30" stroke-width="2"/>
  <text x="760" y="300" class="s" style="fill:#d72c30">墨消し範囲</text>
  <rect x="1054" y="214" width="178" height="342" fill="#fff" stroke="#d8dee6"/>
  <text x="1070" y="246" class="h">墨消しプロパティ</text>
  <rect x="1070" y="270" width="146" height="62" rx="3" class="soft"/><text x="1080" y="294" class="s">ドラッグで範囲指定</text><text x="1080" y="316" class="s">EscでOCR編集へ</text>
  <text x="1070" y="362" class="t">色　#102030</text>
  <circle cx="1084" cy="388" r="10" fill="#000"/><circle cx="1114" cy="388" r="10" fill="#fff" stroke="#88939f"/><circle cx="1144" cy="388" r="10" fill="#d72c30"/>
  <rect x="1070" y="420" width="146" height="42" rx="3" class="soft"/><text x="1082" y="446" class="t">OCR操作を停止</text>
  <text x="1070" y="492" class="s muted">追加後もモード維持</text>

  <rect x="28" y="616" width="1224" height="108" rx="4" class="ok"/>
  <text x="52" y="649" class="h">一貫した状態遷移</text>
  <text x="52" y="678" class="t">OCR編集　― ツールバー「墨消し」／モード一覧 ―→　墨消し　― Esc／ツールバー「OCR編集」／モード一覧 ―→　OCR編集</text>
  <text x="52" y="705" class="s muted">モード切替自体はプロジェクトを変更しません。範囲を追加・解除したときだけUndo/Redo履歴と保存対象を更新します。</text>
</svg>
