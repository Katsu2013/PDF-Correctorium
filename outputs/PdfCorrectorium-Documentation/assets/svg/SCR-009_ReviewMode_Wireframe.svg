<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">SCR-009 校正・確認</title><desc id="desc">現行UIの模式図 / 対象一覧は現在ページ。前後移動はページ順・読み順に検索します。</desc>
<style>text{font-family:'Yu Gothic UI','Meiryo','Segoe UI',sans-serif;fill:#263746}.t{font-size:15px}.muted{font-size:14px;fill:#667085}.title{font-size:23px;font-weight:600}.small{font-size:13px}.accent{font-size:15px;fill:#d72c30}.label{font-size:17px;font-weight:600}</style>
<rect width="1280" height="850" fill="#f5f6f8"/><text x="25" y="34" class="title">SCR-009 校正・確認</text><text x="25" y="61" class="muted">現行UIの模式図 / 対象一覧は現在ページ。前後移動はページ順・読み順に検索します。</text><rect x="20" y="80" width="1240" height="708" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="35" y="104" class="t">PDF Correctorium</text><text x="1230" y="104" class="t">×</text><text x="35" y="136" class="t">ファイル　編集　表示　しおり　OCR　ページ　検証　ヘルプ</text><rect x="34" y="151" width="52" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="44" y="171" class="t">開く</text><rect x="92" y="151" width="52" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="102" y="171" class="t">保存</text><rect x="150" y="151" width="44" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="160" y="171" class="t">↶</text><rect x="200" y="151" width="44" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="210" y="171" class="t">↷</text><text x="273" y="172" class="t">‹　1 / 2　›</text><rect x="395" y="151" width="35" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="405" y="171" class="t">−</text><rect x="436" y="151" width="35" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="446" y="171" class="t">＋</text><rect x="477" y="151" width="52" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="487" y="171" class="t">100</text><rect x="535" y="151" width="70" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="545" y="171" class="t">フィット</text><rect x="640" y="151" width="115" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="649" y="171" class="t">行編集</text><text x="734" y="171" class="muted">⌄</text><path d="M20 192H1260 M268 193V750 M928 193V750 M20 750H1260" stroke="#b8c1ce"/><rect x="775" y="151" width="139" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="784" y="171" class="t">校正・確認</text><text x="893" y="171" class="muted">⌄</text><text x="37" y="219" class="muted">ページ</text><text x="111" y="219" class="t">しおり</text><path d="M105 227H160" stroke="#d72c30" stroke-width="2"/><text x="38" y="255" class="t">▱＋　▱↳＋　削除　↑　↓</text><text x="38" y="296" class="t">第1章　はじめに　p.1</text><text x="38" y="325" class="t">　1-1 文書の準備　p.1</text><text x="38" y="354" class="t">　1-2 校正の流れ　p.1</text><text x="38" y="383" class="t">第2章　設定　p.2</text><rect x="276" y="200" width="644" height="542" fill="#343e49"/><rect x="344" y="215" width="505" height="513" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="382" y="285" class="title">文書の読み取りと校正</text><text x="382" y="340" class="t">原画像に重ねたOCR文字を確認します。</text><rect x="378" y="318" width="424" height="31" fill="#ffdd6544" stroke="#d72c30"/><text x="382" y="390" class="t">文字の修正と配置の調整は別の操作です。</text><rect x="378" y="368" width="424" height="31" fill="#ffdd6544" stroke="#d72c30"/><text x="946" y="218" class="label">校正・確認</text><text x="946" y="247" class="muted">文字と確認ステータスを編集</text><rect x="946" y="262" width="294" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="955" y="282" class="t">未確認・要再確認</text><text x="1219" y="282" class="muted">⌄</text><text x="946" y="319" class="muted">このページの対象: 2件</text><rect x="946" y="331" width="294" height="79" rx="3" fill="#fff" stroke="#b8c1ce"/><rect x="950" y="335" width="286" height="30" rx="3" fill="#fff0f1" stroke="#b8c1ce"/><text x="958" y="356" class="t">1. 原画像に重ねたOCR文字を…</text><text x="958" y="391" class="t">2. 文字の修正と配置の調整は…</text><rect x="946" y="424" width="143" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="956" y="444" class="t">前の対象</text><rect x="1097" y="424" width="143" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="1107" y="444" class="t">次の対象</text><rect x="946" y="463" width="294" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="956" y="483" class="t">確認済みにして次へ</text><text x="946" y="532" class="t">確認ステータス</text><rect x="946" y="544" width="294" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="955" y="564" class="t">未確認</text><text x="1219" y="564" class="muted">⌄</text><text x="946" y="601" class="t">行の文字列</text><rect x="946" y="612" width="294" height="72" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="957" y="641" class="t">原画像に重ねたOCR文字を</text><text x="957" y="665" class="t">確認します。</text><text x="946" y="720" class="small">対象検索中は「検索を中止」を表示</text><text x="35" y="775" class="small">1ページを表示しました。</text><text x="790" y="775" class="small">ポータブルモード</text><text x="935" y="775" class="t">−</text><path d="M966 770H1126 M1046 756V784" stroke="#8b939c" stroke-width="2"/><rect x="1041" y="760" width="10" height="20" rx="2" fill="#fff" stroke="#7c8694"/><text x="1140" y="775" class="t">＋</text><rect x="1170" y="754" width="76" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="1179" y="774" class="t">100%</text><text x="1225" y="774" class="muted">⌄</text><text x="25" y="817" class="muted">文書端では循環しません。通常クリックはスクロールを維持し、対象一覧・前後移動は対象を表示します。</text></svg>
