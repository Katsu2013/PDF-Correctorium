  <text x="205" y="332" font-family="Yu Gothic, sans-serif" font-size="23" fill="#263746">連絡先：03-1234-5678</text>
  <rect x="196" y="254" width="410" height="66" fill="#000000" fill-opacity="0.62" stroke="#ffffff" stroke-width="4"/>
  <rect x="191" y="249" width="10" height="10" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
  <rect x="396" y="249" width="10" height="10" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
  <rect x="601" y="249" width="10" height="10" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
  <rect x="191" y="282" width="10" height="10" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
  <rect x="601" y="282" width="10" height="10" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
  <rect x="191" y="315" width="10" height="10" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
  <rect x="396" y="315" width="10" height="10" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
  <rect x="601" y="315" width="10" height="10" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
