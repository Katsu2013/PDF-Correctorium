    <rect x="0" y="0" width="42" height="28" fill="#000000"/><rect x="48" y="0" width="42" height="28" fill="#ffffff" stroke="#aeb8c4"/>
    <rect x="96" y="0" width="42" height="28" fill="#d32f2f"/><rect x="144" y="0" width="42" height="28" fill="#1565c0"/>
