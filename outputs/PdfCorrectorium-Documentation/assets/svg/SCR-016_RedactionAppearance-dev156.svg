<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <title>dev.156 墨消し範囲の色・表示・削除</title>
  <desc>作成済みの墨消し範囲を選択し、色の変更、編集画面だけの半透明・不透明切替、Undo可能な削除を行う現行UIの模式図。</desc>
  <rect width="1280" height="760" fill="#f5f7fa"/>
  <text x="64" y="62" font-family="Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#243447">墨消し範囲の色・表示・削除（dev.156）</text>
  <text x="64" y="94" font-family="Yu Gothic, sans-serif" font-size="16" fill="#526273">ページ上または一覧で範囲を選択し、右ペインから後編集します。</text>

  <rect x="64" y="128" width="772" height="520" rx="8" fill="#ffffff" stroke="#c6ced8" stroke-width="2"/>
  <rect x="94" y="158" width="712" height="460" fill="#303b47"/>
  <rect x="176" y="190" width="548" height="396" fill="#ffffff" stroke="#d9dde3"/>
