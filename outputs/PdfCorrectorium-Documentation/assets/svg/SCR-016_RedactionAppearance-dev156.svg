  <text x="226" y="432" font-family="Yu Gothic, sans-serif" font-size="17" fill="#526273">不透明：PDF出力時の塗り色に近い見た目</text>

  <rect x="868" y="128" width="348" height="520" rx="8" fill="#ffffff" stroke="#c6ced8" stroke-width="2"/>
  <text x="898" y="173" font-family="Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#243447">墨消しプロパティ</text>
  <line x1="898" y1="190" x2="1186" y2="190" stroke="#d9dde3"/>
  <text x="898" y="226" font-family="Yu Gothic, sans-serif" font-size="16" fill="#526273">墨消し色</text>
  <rect x="898" y="240" width="244" height="34" rx="3" fill="#ffffff" stroke="#9da8b5"/>
  <text x="912" y="263" font-family="Consolas, monospace" font-size="16" fill="#263746">#000000</text>
  <rect x="1150" y="240" width="36" height="34" fill="#000000" stroke="#9da8b5"/>
