  <rect x="898" y="448" width="288" height="46" rx="4" fill="#fff0f0" stroke="#d9a4a4"/>
  <rect x="914" y="463" width="20" height="16" fill="#000000"/>
  <text x="947" y="478" font-family="Yu Gothic, sans-serif" font-size="16" fill="#263746">196, 254　410×66</text>
  <rect x="898" y="518" width="138" height="42" rx="5" fill="#ffffff" stroke="#d32f2f"/>
  <rect x="1048" y="518" width="138" height="42" rx="5" fill="#ffffff" stroke="#aeb8c4"/>
  <text x="912" y="545" font-family="Yu Gothic, sans-serif" font-size="15" fill="#8f1f1f">選択範囲を削除</text>
  <text x="1064" y="545" font-family="Yu Gothic, sans-serif" font-size="15" fill="#263746">ページ内を全解除</text>
  <rect x="898" y="580" width="288" height="42" rx="5" fill="#eaf7f0" stroke="#47a475"/>
  <text x="914" y="607" font-family="Yu Gothic, sans-serif" font-size="15" fill="#35634d">色変更・削除は Undo / Redo 対象</text>

  <rect x="64" y="680" width="1152" height="46" rx="6" fill="#e9eef5"/>
  <text x="84" y="709" font-family="Yu Gothic, sans-serif" font-size="16" fill="#34495e">半透明／不透明は編集画面だけの表示設定です。PDF出力は選択色で常に不透明に確定します。</text>
</svg>
