<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <style>text{font-family:'Segoe UI','Yu Gothic UI',sans-serif;fill:#222}.box{fill:#fff;stroke:#667085;stroke-width:2}.ttl{font-size:24px;font-weight:600}.t{font-size:18px}</style>
  <rect width="1100" height="700" fill="#f4f6f8"/><rect class="box" x="40" y="35" width="1020" height="620" rx="8"/><text class="ttl" x="70" y="80">プロジェクト診断</text>
  <text class="t" x="80" y="135" fill="#17823b">✓ ZIPコンテナ</text><text class="t" x="80" y="180" fill="#17823b">✓ manifest.json / Format 1.0</text><text class="t" x="80" y="225" fill="#17823b">✓ 元PDF参照・ハッシュ一致</text><text class="t" x="80" y="270" fill="#b26a00">⚠ OCRページ 320件中1件に警告</text><text class="t" x="80" y="315" fill="#17823b">✓ コメント・ブックマーク</text><text class="t" x="80" y="360" fill="#b26a00">⚠ Undo履歴末尾に不完全データ</text>
