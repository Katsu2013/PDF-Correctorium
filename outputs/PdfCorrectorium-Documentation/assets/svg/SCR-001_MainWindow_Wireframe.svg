ke="#d72c30" stroke-width="2"/><text x="38" y="255" class="t">▱＋　▱↳＋　削除　↑　↓</text><text x="38" y="296" class="t">第1章　はじめに　p.1</text><text x="38" y="325" class="t">　1-1 文書の準備　p.1</text><text x="38" y="354" class="t">　1-2 校正の流れ　p.1</text><text x="38" y="383" class="t">第2章　設定　p.2</text><rect x="276" y="200" width="644" height="542" fill="#343e49"/><rect x="344" y="215" width="505" height="513" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="382" y="285" class="title">文書の読み取りと校正</text><text x="382" y="340" class="t">原画像に重ねたOCR文字を確認します。</text><rect x="378" y="318" width="424" height="31" fill="#ffdd6544" stroke="#d72c30"/><text x="382" y="390" class="t">文字の修正と配置の調整は別の操作です。</text><rect x="378" y="368" width="424" height="31" fill="#ffdd6544" stroke="#d72c30"/><text x="947" y="220" class="label">OCRプロパティ</text><text x="947" y="252" class="muted">文字領域: 2件</text><text x="947" y="300" class="t">確認ステータス</text><rect x="947" y="310" width="292" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="956" y="330" class="t">未確認</text><text x="1218" y="330" class="muted">⌄</text><text x="947" y="366" class="t">文字方向</text><rect x="947" y="376" width="292" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="956" y="396" class="t">横書き</text><text x="1218" y="396" class="muted">⌄</text><text x="947" y="430" class="t">行の文字列</text><rect x="947" y="441" width="292" height="70" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="958" y="469" class="t">原画像に重ねたOCR文字を</text><text x="958" y="492" class="t">確認します。</text><text x="947" y="548" class="t">変更前</text><rect x="947" y="558" width="292" height="40" rx="3" fill="#f4f5f7" stroke="#b8c1ce"/><text x="958" y="584" class="small">原画像に重ねたOCR文字を確認します。</text><text x="947" y="635" class="t">位置・サイズ・回転</text><text x="947" y="665" class="small">X 38.0　Y 61.0　幅 212.0　高さ 15.5</text><text x="35" y="775" class="small">1ページを表示しました。</text><text x="790" y="775" class="small">ポータブルモード</text><text x="935" y="775" class="t">−</text><path d="M966 770H1126 M1046