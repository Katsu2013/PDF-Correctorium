<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#fff"/>
  <g font-family="Meiryo, sans-serif" fill="#182230">
    <text x="32" y="42" font-size="25" font-weight="bold">PDF Correctorium：現行ワークスペース</text>
    <text x="32" y="70" font-size="15" fill="#526171">操作領域の模式図。PDF紙面の色と表示倍率はテーマから独立。</text>
    <rect x="32" y="92" width="1216" height="40" rx="6" fill="#f0f2f5"/>
    <text x="48" y="118" font-size="17">メニュー　｜　共通ツールバー　｜　段落 → 行 → 文字　｜　ヘッドホン：読み上げ</text>
    <rect x="32" y="145" width="38" height="516" fill="#e7edf4"/>
    <text x="51" y="188" text-anchor="middle" font-size="17">頁</text>
    <text x="51" y="234" text-anchor="middle" font-size="17">栞</text>
    <rect x="80" y="145" width="208" height="516" fill="#f6f8fa" stroke="#bcc5cf"/>
    <text x="96" y="178" font-size="18" font-weight="bold">ページ／しおり</text>
    <text x="96" y="212" font-size="15">表示メニューで復元</text>
    <text x="96" y="249" font-size="15">1ページ</text><text x="96" y="284" font-size="15">2ページ</text>
    <text x="96" y="336" font-size="15">収納は左側を一括</text><text x="96" y="365" font-size="15">固定へ戻すのは個別</text>
    <rect x="302" y="145" width="560" height="516" fill="#343c46"/>
    <rect x="350" y="173" width="464" height="457" fill="#fff"/>
    <text x="378" y="211" font-size="18" font-weight="bold">PDF編集画面</text>
    <rect x="377" y="239" width="410" height="92" fill="none" stroke="#2d9b9e" stroke-opacity="0.5"/>
    <text x="390" y="271" font-size="19" fill="#c33">OCR文字の確認・編集</text>
    <text x="390" y="305" font-size="16">段落・行・文字の枠は表示切替</text>
    <rect x="377" y="352" width="410" height="45" fill="#fff0a0" fill-opacity="0.6"/>
    <text x="390" y="381" font-size="16">枠を隠しても検索対象はマーカー</text>
    <text x="390" y="439" font-size="16">ルビは画面での確認用</text>
    <text x="390" y="473" font-size="16">読み方のPDF保存は原文を維持</text>
    <text x="390" y="507" font-size="16">背景読込で表示ページを優先</text>
    <rect x="876" y="145" width="324" height="516" fill="#f6f8fa" stroke="#bcc5cf"/>
    <text x="892" y="178" font-size="18" font-weight="bold">独立したドッキングパネル</text>
    <text x="892" y="218" font-size="17">OCR・校正　／　リンク</text>
    <text x="892" y="252" font-size="17">墨消し　／　コメント・タグ</text>
    <text x="892" y="286" font-size="17">読み上げ</text>
    <path d="M892 308H1184" stroke="#bcc5cf"/>
    <text x="892" y="343" font-size="16">閲覧だけではモードを変えない</text>
    <text x="892" y="383" font-size="16">収納は右側を一括</text>
    <text x="892" y="417" font-size="16">固定へ戻すのは個別</text>
    <text x="892" y="451" font-size="16">後から開くパネルも同じ方針</text>
    <text x="892" y="499" font-size="16">配置と展開幅を次回も復元</text>
    <rect x="1210" y="145" width="38" height="516" fill="#e7edf4"/>
    <text x="1229" y="188" text-anchor="middle" font-size="16">OCR</text>
    <text x="1229" y="234" text-anchor="middle" font-size="17">鎖</text>
    <text x="1229" y="280" text-anchor="middle" font-size="17">音</text>
    <rect x="32" y="676" width="1216" height="40" rx="6" fill="#f0f2f5"/>
    <text x="48" y="702" font-size="16">ステータスバー：背景確認の進捗・処理結果　｜　保存モード　｜　表示倍率</text>
    <text x="32" y="744" font-size="14" fill="#526171">図中の略号は説明用。実際の収納タブは共通アイコン＋文字で表示する。</text>
  </g>
</svg>
