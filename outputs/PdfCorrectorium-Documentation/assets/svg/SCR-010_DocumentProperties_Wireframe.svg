<title id="title">SCR-010 文書のプロパティ</title><desc id="desc">現行UIの模式図 / 詳細設定タブの例。最大化・最小化なし。文書を読み込んだ後に利用できます。</desc>
<style>text{font-family:'Yu Gothic UI','Meiryo','Segoe UI',sans-serif;fill:#263746}.t{font-size:15px}.muted{font-size:14px;fill:#667085}.title{font-size:23px;font-weight:600}.small{font-size:13px}.accent{font-size:15px;fill:#d72c30}.label{font-size:17px;font-weight:600}</style>
<rect width="1280" height="850" fill="#f5f6f8"/><text x="25" y="34" class="title">SCR-010 文書のプロパティ</text><text x="25" y="61" class="muted">現行UIの模式図 / 詳細設定タブの例。最大化・最小化なし。文書を読み込んだ後に利用できます。</text><rect x="211" y="90" width="858" height="696" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="232" y="119" class="t">文書のプロパティ</text><text x="1033" y="119" class="t">×</text><text x="235" y="160" class="t">概要　　セキュリティ　　フォント　　カスタム　　詳細設定</text><path d="M532 168H601" stroke="#d72c30" stroke-width="2"/><rect x="234" y="190" width="811" height="76" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="250" y="215" class="label">PDF設定</text><text x="250" y="246" class="t">ベースURL:　—　　　　　検索インデックス:　—　　　　　トラッピング: 不明</text><rect x="234" y="282" width="811" height="125" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="250" y="309" class="label">PDFバージョン</text><text x="253" y="340" class="t">元PDFのバージョン:　1.4</text><text x="253" y="379" class="t">出力PDFのバージョン:</text><rect x="442" y="357" width="582" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="451" y="377" class="t">自動（推奨）</text><text x="1003" y="377" class="muted">⌄</text><rect x="234" y="423" width="811" height="135" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="250" y="450" class="label">PDFを開いたときの表示</text><text x="254" y="480" class="t">ページレイアウト:</text><rect x="442" y="459" width="582" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="451" y="479" class="t">見開き</text><text x="1003" y="479" class="muted">⌄</text><text x="254" y="517" class="t">綴じ方向:</text><rect x="442" y="495" width="582" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="451" y="515" class="t">左綴じ（右開き・左から右）</text><text x="1003" y="515" class="muted">⌄</text><text x="442" y="547" class="small">☑ 見開き時に1ページ目を表紙として単独表示する</text><rect x="234" y="574" width="811" height="70" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="250" y="600" class="label">印刷ダイアログプリセット</text><text x="253" y="629" class="small">ページの拡大／縮小: 既定　　両面印刷モード: 既定　　部数: 既定</text><rect x="234" y="660" width="811" height="70" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="250" y="686" class="label">読み上げオプション</text><text x="253" y="715" class="t">文書の言語:</text><rect x="442" y="693" width="582" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="451" y="713" class="t">ja-JP</text><text x="1003" y="713" class="muted">⌄</text><rect x="815" y="745" width="107" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="825" y="765" class="t">キャンセル</text><rect x="935" y="745" width="109" height="30" rx="3" fill="#fff" stroke="#b8c1ce"/><text x="945" y="765" class="t">適用</text><text x="25" y="817" class="muted">概要タブでタイトル・作者名等を編集。言語は候補選択/直接入力に対応。適用値は保存・PDF出力へ反映します。</text></svg>
