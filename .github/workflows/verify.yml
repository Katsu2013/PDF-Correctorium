name: Verify Windows release inputs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify source, isolated PDF processing, persistence and exact archive contents
        run: ./tools/InvokeReleaseVerification.ps1 -OutputDirectory outputs/ci-verification
      - name: Retain generated evidence and the clean unsigned development ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            outputs/ci-verification/*.log
            outputs/ci-verification/failure.txt
            outputs/ci-verification/verification-summary.json
            outputs/ci-verification/verified-build-info.json
            outputs/ci-verification/PdfCorrectorium-*.zip
            outputs/ci-verification/**/checks.txt
